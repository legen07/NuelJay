name: Feature Request
description: Suggest an idea for NuelJay
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Is there something that doesn't work or is missing?
    validations:
      - required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this could be solved?
    validations:
      - required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds?
    validations:
      - required: false
